name: TableLite

# 部署目标不在这里写死：由 make deps 从链接进来的静态库的 minos 推导（= 依赖下限），
# 经 Configs/Local.xcconfig 的 TABLELITE_DEPLOYMENT_TARGET 注入；
# default= 是 Local.xcconfig 缺失时的兜底值。
# 理由见 docs/tech-designs/12-build-and-deps.md §3.3。
options:
  bundleIdPrefix: com.graycarl
  deploymentTarget:
    macOS: "$(TABLELITE_DEPLOYMENT_TARGET:default=26.0)"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: $(TABLELITE_DEPLOYMENT_TARGET:default=26.0)
    # 只出 arm64 单架构：Homebrew 的 .a 只有 arm64，而 Release 的 ARCHS 默认是
    # arm64 x86_64，x86_64 切片必然链接失败（Debug 靠 ONLY_ACTIVE_ARCH 躲过；
    # 装了 Rosetta 的机器上 xcodebuild 会把两个架构都编一遍）。
    # 自用工具不需要 Intel 产物。见 docs/tech-designs/12-build-and-deps.md §3.1。
    ARCHS: arm64
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    DEAD_CODE_STRIPPING: YES
    ALWAYS_SEARCH_USER_PATHS: NO
    CLANG_ENABLE_OBJC_ARC: YES

targets:
  # ---------------------------------------------------------------
  # libmysqlclient 的薄 C 封装层。
  # 只编译，不链接 libmysqlclient —— 链接（静态）由 App target 完成。
  # 静态链接的理由与代价见 docs/tech-designs/12-build-and-deps.md §3.1。
  #
  # Swift 侧通过 `import CMySQLClient` 使用：
  #   Sources/CMySQLClient/include/module.modulemap 把公开头文件暴露成模块，
  #   两个 target 的 HEADER_SEARCH_PATHS 都指向该目录。
  # ---------------------------------------------------------------
  CMySQLClient:
    type: library.static
    platform: macOS
    sources:
      - path: Sources/CMySQLClient
    settings:
      base:
        GCC_C_LANGUAGE_STANDARD: gnu11
        GCC_WARN_ABOUT_RETURN_TYPE: YES
        GCC_WARN_UNINITIALIZED_AUTOS: YES
        CLANG_WARN_DOCUMENTATION_COMMENTS: NO
        HEADER_SEARCH_PATHS:
          - $(SRCROOT)/Sources/CMySQLClient/include
          - $(MYSQL_CLIENT_PREFIX)/include/mysql
        PUBLIC_HEADERS_FOLDER_PATH: include
        SKIP_INSTALL: YES

  # ---------------------------------------------------------------
  # 应用本体
  # ---------------------------------------------------------------
  TableLite:
    type: application
    platform: macOS
    sources:
      - path: Sources/TableLite
    dependencies:
      - target: CMySQLClient
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.graycarl.tablelite
        PRODUCT_NAME: TableLite
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"

        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Sources/TableLite/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Sources/TableLite/Resources/TableLite.entitlements

        # 自用工具：不开沙箱、不公证。签名身份优先用本机自签名证书
        # （scripts/dev/codesign-identity.sh 建的，用来让代码身份跨构建稳定；
        # 注意它**不能**让登录钥匙串的授权跨构建有效，凭据已移出钥匙串）；
        # 没装证书的机器落到 ad-hoc 签名。
        # 必须是这种变量间接写法：target 级设置会盖住工程级 xcconfig，
        # 把身份直接写进 Configs/Local.xcconfig 是不会生效的。
        # 见 docs/tech-designs/12-build-and-deps.md §3.4。
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: $(TABLELITE_CODESIGN_IDENTITY:default=-)
        DEVELOPMENT_TEAM: ""
        PROVISIONING_PROFILE_SPECIFIER: ""
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: NO

        HEADER_SEARCH_PATHS:
          - $(SRCROOT)/Sources/CMySQLClient/include
          - $(MYSQL_CLIENT_PREFIX)/include/mysql

        # 全静态链接：产物不留任何 /opt/homebrew 的 dylib 引用（决策见
        # docs/tech-designs/12-build-and-deps.md §3.1）。
        # 必须显式 -lc++：Swift target 不会自动带 C++ 运行库，而 libmysqlclient 是 C++ 写的。
        # 不设 LIBRARY_SEARCH_PATHS / LD_RUNPATH_SEARCH_PATHS —— 没有动态库要找。
        OTHER_LDFLAGS: $(inherited) $(MYSQL_CLIENT_PREFIX)/lib/libmysqlclient.a $(OPENSSL_PREFIX)/lib/libssl.a $(OPENSSL_PREFIX)/lib/libcrypto.a $(ZSTD_PREFIX)/lib/libzstd.a $(ZLIB_NG_PREFIX)/lib/libz.a -lresolv -lc++

  # ---------------------------------------------------------------
  # 单元测试
  # ---------------------------------------------------------------
  TableLiteTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/TableLiteTests
    dependencies:
      - target: TableLite
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/TableLite.app/Contents/MacOS/TableLite

schemes:
  TableLite:
    build:
      targets:
        TableLite: all
        CMySQLClient: all
        TableLiteTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - TableLiteTests
    archive:
      config: Release

# 机器相关路径放在不进版本控制的 xcconfig 里（由 make deps 生成）
configFiles:
  Debug: Configs/Local.xcconfig
  Release: Configs/Local.xcconfig
