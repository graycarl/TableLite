# 冒烟验证用的 MySQL 服务器。
#
# 由 scripts/smoke/run.sh 起停；也可以单独拉起来，给 P1 的集成测试复用：
#   docker-compose -p tablelite-smoke -f scripts/smoke/docker-compose.yml up -d --wait
#
# 端口默认 13306，避开本机已有的 3306；改端口用 SMOKE_MYSQL_PORT。
# 支持的服务器版本见 docs/tech-designs/15-testing.md §1。
services:
  mysql:
    image: mysql:8.4
    container_name: tablelite-smoke-mysql
    command:
      # 冒烟里有 KILL QUERY 的中断用例，关掉 DNS 反查能让连接更快、更稳定
      - --skip-name-resolve
      - --local-infile=0
    environment:
      MYSQL_ROOT_PASSWORD: tablelite
    ports:
      - "127.0.0.1:${SMOKE_MYSQL_PORT:-13306}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-ptablelite"]
      interval: 2s
      timeout: 3s
      retries: 60
      start_period: 10s
